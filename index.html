<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Marketing Budget Optimizer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14282a;--mute:#5b7072;--line:#dbe4e2;--head:#11302b;--jd:#1aa37a;--rd:#e0453a;--am:#e8a317;--bl:#2f6fdb;--pl:#7a4fd1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a1b;--card:#132527;--ink:#e6f1ef;--mute:#8fa9ab;--line:#24403f;--head:#081513;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a1b;--card:#132527;--ink:#e6f1ef;--mute:#8fa9ab;--line:#24403f;--head:#081513;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--head);color:#fff;padding:16px 24px 0}h1{margin:0;font-size:21px;font-weight:700}header p{margin:2px 0 12px;color:#9fc4bc;font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto}nav button{background:none;border:0;color:#9fc4bc;padding:10px 15px;font:500 13px "IBM Plex Sans",sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}nav button.on{color:#fff;border-color:var(--am)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--am);outline-offset:2px}
main{padding:20px 24px;max-width:1220px;margin:auto}.grid{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;margin-bottom:14px}.grid .card{margin-bottom:0}.card h3{margin:0 0 6px;font-size:15px}
.kpi{border-left:5px solid var(--jd)}.kpi b{display:block;font-size:26px;line-height:1.15}.kpi span{font-size:12px;color:var(--mute)}.kpi.r{border-color:var(--rd)}.kpi.a{border-color:var(--am)}.kpi.b{border-color:var(--bl)}
.nt{font-size:12.5px;color:var(--mute);margin:5px 0}.tg{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px;color:#fff;background:var(--bl)}.tg.b{background:var(--rd)}.tg.g{background:var(--jd)}
.i{display:inline-block;width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--mute);font-size:10px;font-weight:700;text-align:center;line-height:15px;cursor:help;margin-left:4px}
svg{width:100%;height:auto;display:block}.gl{stroke:var(--line)}.ax{fill:var(--mute);font-size:11px}.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-size:12px;font-weight:500}th[data-s]{cursor:pointer}th[data-s]:hover{color:var(--jd)}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}.p-g{background:#1aa37a22;color:var(--jd)}.p-r{background:#e0453a22;color:var(--rd)}.p-a{background:#e8a31733;color:#a87200}.p-b{background:#2f6fdb22;color:var(--bl)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.btn,.chip{font:500 12px "IBM Plex Sans",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;cursor:pointer}.btn.p{background:var(--jd);border-color:var(--jd);color:#fff}.chip:hover{border-color:var(--jd)}
select,.ask input{font:500 13px "IBM Plex Sans",sans-serif;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.hb .n{width:170px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .t{flex:1;position:relative;height:16px}.hb .t i{position:absolute;top:0;height:100%;border-radius:3px}.hb .t u{position:absolute;left:var(--z);top:-2px;bottom:-2px;width:1px;background:var(--mute)}.hb .v{width:78px;text-align:right}
#chat{height:430px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.m{max-width:92%;padding:10px 13px;border-radius:12px}.m.u{align-self:flex-end;background:var(--jd);color:#fff}.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.st{font-size:12px;color:var(--mute);font-family:ui-monospace,Menlo,monospace}.st:before{content:"✓ ";color:var(--jd)}.ask{display:flex;gap:8px;margin-top:10px}.ask input{flex:1;border-radius:99px;padding:10px 14px}
.sl{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:12px}.sl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}input[type=range]{width:100%;accent-color:var(--jd)}
@media (max-width:600px){main,header{padding-left:14px;padding-right:14px}.hb .n{width:110px}}
</style></head><body><header><h1>Marketing Budget Optimizer</h1><p>Which campaigns create profitable customers, and where should the next rupee go? Assumed data: 17 campaigns, 10 channels, ₹661 L annual budget</p><nav id="nav"></nav></header><main id="app"></main>
<script>
const CC={Search:'#2f6fdb',Social:'#d6336c',Video:'#7a4fd1',Email:'#e8a317',SEO:'#1aa37a',Affiliate:'#ff7f50',Events:'#0e9fb5',Referral:'#8a9a1b',Display:'#6b7a90',LinkedIn:'#0a66c2'};
const D=[['Brand Search – Always-on','Search',40,900,18,.5,1.4,.3,.35],['Generic Search – High intent','Search',70,700,20,.5,1.5,.85,.75],['Search – Competitor terms','Search',25,150,22,.5,1.2,.8,.7],['Meta – Lookalike prospecting','Social',90,1100,12,.45,1.1,.9,.6],['Meta – Retargeting','Social',35,600,14,.45,1,.35,.4],['Influencer – Reels','Social',45,380,16,.45,1.3,.8,.65],['YouTube – Brand video','Video',60,300,25,.55,1.6,.7,.8],['Email – Lifecycle','Email',18,700,21,.55,1.8,.9,.9],['Email – Win-back','Email',8,220,19,.55,1.5,.8,.8],['SEO – Content hub','SEO',35,800,20,.55,1.6,.95,.9],['Affiliate – Coupon sites','Affiliate',30,650,15,.35,1,.25,.5],['Affiliate – Content partners','Affiliate',20,260,24,.5,1.4,.8,.75],['Webinars & events','Events',40,160,60,.6,2,.95,.85],['Referral program','Referral',25,420,26,.55,1.9,.9,.95],['Display – Programmatic','Display',50,500,10,.4,.9,.35,.45],['Influencer – Mega','Social',30,120,28,.5,1.2,.6,.7],['LinkedIn – B2B leads','LinkedIn',40,90,120,.6,1.8,.85,.7]].map(([n,ch,sp,cu,aov,mg,rp,inc,b],i)=>{const ltv=aov/100*mg*rp,V0=cu*inc*ltv;return{i,n,ch,sp,cu,aov,mg,inc,b,ltv,V0,cac:sp/cu,tcac:sp/(cu*inc),rroas:cu*aov/100/sp,rprof:cu*ltv-sp,tprof:V0-sp,roi:(V0-sp)/sp,pay:12*sp/(cu*inc)/ltv}});
const sum=a=>a.reduce((x,y)=>x+y,0),TS=sum(D.map(c=>c.sp)),TP=sum(D.map(c=>c.tprof)),RP=sum(D.map(c=>c.rprof)),LOSS=-sum(D.filter(c=>c.tprof<0).map(c=>c.tprof)),NEG=sum(D.filter(c=>c.tprof<0).map(c=>c.sp));
const V=(c,x)=>c.V0*Math.pow(x/c.sp,c.b),mg=(c,x)=>c.b*V(c,x)/x-1,pf=(c,x)=>V(c,x)-x,verd=c=>{const m=mg(c,c.sp);return m>=.5?['Scale','p-g']:m>=0?['Hold','p-b']:m>=-.5?['Fix','p-a']:['Cut','p-r']};
const fL=x=>Math.abs(x)>=100?`₹${(x/100).toFixed(2)} Cr`:`₹${x.toFixed(1)} L`,pc=(x,d=0)=>(x*100).toFixed(d)+'%',fN=x=>Math.round(x).toLocaleString('en-IN');
function opt(cap,bc){const T=TS*(1+bc),x=D.map(c=>c.sp*(1-cap)),hi=D.map(c=>c.sp*(1+cap));let rem=T-sum(x);while(rem>.01){let b=-1,bm=0;D.forEach((c,i)=>{if(x[i]<hi[i]-.01){const m=mg(c,x[i]);if(b<0||m>bm){b=i;bm=m}}});if(b<0||bm<0)break;const s=Math.min(.5,rem,hi[b]-x[b]);x[b]+=s;rem-=s}return x}
const tot=x=>({sp:sum(x),pr:sum(D.map((c,i)=>pf(c,x[i]))),cu:sum(D.map((c,i)=>c.cu*c.inc*Math.pow(x[i]/c.sp,c.b)))});
let tab='Overview',chf='All',sk='tprof',sd=-1,sel=12,cap=40,bch=0,adj=Array(17).fill(0),hist=[];
const base=tot(D.map(c=>c.sp)),KW=[[/mega/,15],[/linkedin|b2b/,16],[/partner/,11],[/coupon|affiliate/,10],[/brand/,0],[/generic/,1],[/competitor/,2],[/lookalike|prospect/,3],[/retarget/,4],[/reels|influencer/,5],[/youtube|video/,6],[/lifecycle|email/,7],[/win/,8],[/seo|content/,9],[/webinar|event/,12],[/referral/,13],[/display|programmatic/,14]];
const nt=(h,s)=>`<div class="nt"><span class="tag tg">How to read</span>${h}</div>`.replace('tag ','')+(s?`<div class="nt"><span class="tg b">So what</span>${s}</div>`:''),inf=t=>`<span class="i" title="${t}">i</span>`,lgd=a=>`<div class="lg">${a.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
function hbar(items,fmt=fL){const m=Math.max(...items.map(x=>Math.abs(x.v)),1),neg=items.some(x=>x.v<0),z=neg?50:0;return items.map(x=>`<div class="hb"><span class="n" title="${x.n}">${x.n}</span><div class="t" style="--z:${z}%">${neg?'<u></u>':''}<i style="background:${x.c};left:${x.v<0?50-Math.abs(x.v)/m*50:z}%;width:${Math.abs(x.v)/m*(neg?50:100)}%"></i></div><span class="v">${fmt(x.v)}</span></div>`).join('')}
function scat(){const w=640,h=300,xm=Math.max(...D.map(c=>c.rroas))*1.1,ys=D.map(c=>c.roi),yM=Math.max(...ys)*1.1,ym=Math.min(...ys)*1.1,x=v=>46+v/xm*(w-70),y=v=>12+(yM-v)/(yM-ym)*(h-48);let g=`<line x1="46" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--mute)" stroke-dasharray="5 4"/><text x="${w-4}" y="${y(0)-5}" class="ax" text-anchor="end">break-even</text><text x="${w/2}" y="${h-6}" class="ax" text-anchor="middle">Platform-reported ROAS (×)</text><text x="4" y="12" class="ax">True profit ROI</text><rect x="${x(1.5)}" y="${y(0)}" width="${w-x(1.5)}" height="${h-36-y(0)}" fill="#e0453a" opacity=".07"/><text x="${x(1.5)+6}" y="${h-44}" class="ax" fill="#e0453a">looks good, loses money</text>`;
for(let i=0;i<=4;i++)g+=`<text x="${x(xm*i/4)}" y="${h-22}" class="ax" text-anchor="middle">${(xm*i/4).toFixed(1)}</text>`;D.forEach(c=>g+=`<circle cx="${x(c.rroas)}" cy="${y(c.roi)}" r="${5+c.sp/12}" fill="${CC[c.ch]}" fill-opacity=".72"><title>${c.n}: reported ${c.rroas.toFixed(1)}×, true ROI ${pc(c.roi)}, spend ${fL(c.sp)}</title></circle>`);return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}
function curve(c){const w=640,h=250,xs=Array.from({length:37},(_,k)=>c.sp*(.2+k*.05)),mx=Math.max(...xs.map(v=>V(c,v)),...xs)*1.08,X=v=>40+(v-xs[0])/(xs[36]-xs[0])*(w-60),Y=v=>10+(1-v/mx)*(h-40),pl=f=>xs.map(v=>X(v)+','+Y(f(v))).join(' '),o=opt(cap/100,bch/100)[c.i];let g='';for(let i=0;i<=4;i++){g+=`<line x1="40" x2="${w}" y1="${Y(mx*i/4)}" y2="${Y(mx*i/4)}" class="gl"/><text x="35" y="${Y(mx*i/4)+3}" class="ax" text-anchor="end">${(mx*i/4).toFixed(0)}</text>`}
g+=`<polyline fill="none" stroke="#1aa37a" stroke-width="3" points="${pl(v=>V(c,v))}"/><polyline fill="none" stroke="#e0453a" stroke-width="2.5" stroke-dasharray="6 5" points="${pl(v=>v)}"/>`;[[c.sp,'Now','#14282a'],[o,'AI plan','#2f6fdb']].forEach(([v,l,col])=>g+=`<line x1="${X(v)}" x2="${X(v)}" y1="10" y2="${h-30}" stroke="${col}" stroke-dasharray="3 3"/><circle cx="${X(v)}" cy="${Y(V(c,v))}" r="5" fill="${col}"/><text x="${X(v)+5}" y="${l=='Now'?22:36}" class="ax" fill="${col}">${l} ${fL(v)}</text>`);g+=`<text x="${w/2}" y="${h-6}" class="ax" text-anchor="middle">Annual spend (₹ L)</text>`;return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}
const vp=c=>{const [t,k]=verd(c);return`<span class="pill ${k}">${t}</span>`};
const VW={
Overview(){const s=[...D].sort((a,b)=>b.tprof-a.tprof),pl=opt(.4,0),gain=tot(pl).pr-base.pr,chs=[...new Set(D.map(c=>c.ch))].map(ch=>({n:ch,sp:sum(D.filter(c=>c.ch==ch).map(c=>c.sp)),pr:sum(D.filter(c=>c.ch==ch).map(c=>c.tprof))}));
return`<div class="grid k"><div class="card kpi b"><b>${fL(TS)}</b><span>Annual spend ${inf('Sum of spend across 17 campaigns.')}</span></div><div class="card kpi a"><b>${fL(RP)}</b><span>Profit as platforms report it ${inf('Customers × 12-month gross profit − spend, counting every attributed customer.')}</span></div><div class="card kpi ${TP>0?'':'r'}"><b>${fL(TP)}</b><span>True incremental profit ${inf('Same calculation but counting only customers who would not have bought anyway.')}</span></div><div class="card kpi r"><b>${fL(LOSS)}</b><span>Lost in unprofitable campaigns</span></div><div class="card kpi r"><b>${pc(NEG/TS)}</b><span>Budget in loss-making campaigns</span></div><div class="card kpi"><b>+${fL(gain)}</b><span>Profit gain from AI plan, same budget ${inf('Reallocation within ±40% per campaign using response curves.')}</span></div></div>
<div class="grid c2" style="margin-top:14px"><div class="card"><h3>True profit by campaign</h3>${hbar(s.map(c=>({n:c.n,v:c.tprof,c:c.tprof>=0?'#1aa37a':'#e0453a'})))}${nt('Bars right of the line earn more than they cost over 12 months. Bars to the left lose money.','The top 5 campaigns together earn more than the entire portfolio, because the bottom ones erase profit.')}</div>
<div><div class="card"><h3>Spend vs profit by channel</h3>${hbar(chs.sort((a,b)=>b.pr-a.pr).map(c=>({n:c.n+' · spend '+fL(c.sp),v:c.pr,c:CC[c.n]})))}${nt('Each bar is the channel’s true profit; the label shows what it spends.',`Social and Display spend ${fL(chs.filter(c=>c.n=='Social'||c.n=='Display').reduce((a,c)=>a+c.sp,0))} yet return a loss.`)}</div>
<div class="card"><h3>Why the numbers differ</h3><p class="nt">Platforms report ${fL(RP)} profit, but ${fL(RP-TP)} of that comes from customers who would have converted anyway (brand searches, retargeting, coupon sites). Budget decisions based on reported numbers over-fund exactly those campaigns.</p></div></div></div>`},
Campaigns(){const l=D.filter(c=>chf=='All'||c.ch==chf).sort((a,b)=>sd*(a[sk]-b[sk]));const H=[['n','Campaign'],['sp','Spend'],['cu','Customers'],['cac','CAC'],['rroas','Reported ROAS'],['inc','Incremental'],['tcac','True CAC'],['pay','Payback (mo)'],['tprof','True profit'],['roi','ROI']];
return`<div class="row"><select id="cf"><option>All</option>${Object.keys(CC).map(c=>`<option ${c==chf?'selected':''}>${c}</option>`).join('')}</select><span class="nt">Click a column to sort</span></div><div class="card"><h3>Campaign scorecard</h3><div class="tw"><table><tr>${H.map(([k,t])=>`<th data-s="${k}">${t}${sk==k?(sd<0?' ▼':' ▲'):''}</th>`).join('')}<th>Verdict ${inf('Based on marginal return: Scale > ₹0.50 per extra ₹1, Hold > 0, Fix > −0.50, otherwise Cut.')}</th></tr>${l.map(c=>`<tr><td><span style="color:${CC[c.ch]}">●</span> ${c.n}</td><td>${fL(c.sp)}</td><td>${fN(c.cu)}</td><td>${fL(c.cac)}</td><td>${c.rroas.toFixed(1)}×</td><td>${pc(c.inc)}</td><td>${fL(c.tcac)}</td><td>${c.pay>24?'>24':c.pay.toFixed(1)}</td><td style="color:${c.tprof<0?'var(--rd)':'var(--jd)'};font-weight:600">${fL(c.tprof)}</td><td>${pc(c.roi)}</td><td>${vp(c)}</td></tr>`).join('')}</table></div>${nt('CAC is spend per attributed customer. True CAC divides by incremental customers only. Payback is months of gross profit needed to recover true CAC.','Several campaigns have a true CAC two to four times their reported CAC.')}</div>`},
Effect(){const s=[...D].sort((a,b)=>a.inc-b.inc);return`<div class="grid c2"><div class="card"><h3>Reported ROAS vs true profit ROI</h3>${scat()}${nt('Each bubble is a campaign (size = spend). Left to right is how good it looks in platform dashboards. Up to down is whether it actually makes money. The red zone is the trap.','Retargeting, coupon sites and brand search look healthy but sit at or below break-even.')}</div>
<div class="card"><h3>Incrementality: how many customers are truly new? ${inf('Estimated from holdout tests and geo experiments. Assumed values.')}</h3>${hbar(s.map(c=>({n:c.n,v:c.inc*100,c:c.inc<.5?'#e0453a':c.inc<.8?'#e8a317':'#1aa37a'})),x=>x.toFixed(0)+'%')}${nt('Share of attributed customers who would not have converted without the ad.','Where incrementality is under 50%, more than half the “conversions” are ads claiming credit for existing demand.')}</div></div>`},
Curves(){const c=D[sel],m=mg(c,c.sp),o=opt(cap/100,bch/100)[c.i];return`<div class="row"><select id="cs">${D.map(x=>`<option value="${x.i}" ${x.i==sel?'selected':''}>${x.n}</option>`).join('')}</select></div><div class="grid c2"><div class="card"><h3>${c.n}: response curve</h3>${curve(c)}${lgd([['#1aa37a','Lifetime profit value earned'],['#e0453a','Spend']])}${nt('Green is the gross profit the campaign earns at each spend level. Red is what it costs. The gap is profit. The green curve flattens because each extra rupee reaches less responsive people (diminishing returns).',`Today, ₹1 more earns ${m>=0?'₹'+(1+m).toFixed(2):'only ₹'+(1+m).toFixed(2)} back. AI plan moves spend to <b>${fL(o)}</b> (${o>c.sp?'+':''}${pc(o/c.sp-1)}).`)}</div>
<div class="card"><h3>Diagnostics</h3><div class="tw"><table>${[['Verdict',vp(c)],['Spend',fL(c.sp)],['Attributed customers',fN(c.cu)],['Incremental share',pc(c.inc)],['12-mo profit per customer','₹'+fN(c.ltv*1e5)],['True CAC',fL(c.tcac)],['Saturation exponent ('+c.b+')',c.b<.55?'Saturated, little room to grow':c.b<.8?'Moderate headroom':'Scales almost linearly'],['Marginal return per ₹1',(1+m).toFixed(2)]].map(([a,b])=>`<tr><td>${a}</td><td><b>${b}</b></td></tr>`).join('')}</table></div>${nt('Saturation exponent below 1 means doubling spend less than doubles customers. The lower it is, the sooner returns collapse.')}</div></div>`},
Optimizer(){const x=D.map((c,i)=>c.sp*(1+adj[i]/100)),t=tot(x);return`<div class="grid c2"><div class="card"><h3>Plan settings</h3><div class="sl"><span>Max change / campaign</span><input type="range" min="10" max="50" value="${cap}" data-g="cap"><b>±${cap}%</b></div><div class="sl"><span>Total budget</span><input type="range" min="-20" max="20" value="${bch}" data-g="bch"><b>${bch>0?'+':''}${bch}%</b></div><div class="row"><button class="btn p" id="ap">Apply AI plan</button><button class="btn" id="rs">Reset</button></div>${nt('The AI plan keeps moving ₹0.5 L at a time to the campaign with the highest marginal return, until budget runs out or returns turn negative (unspent money is saved).')}<h3 style="margin-top:12px">Manual what-if ${inf('Drag a slider to change that campaign’s budget. The projection updates instantly.')}</h3>${D.map((c,i)=>`<div class="sl"><span title="${c.n}" style="color:${CC[c.ch]}">${c.n}</span><input type="range" min="-60" max="60" value="${adj[i]}" data-a="${i}"><b>${adj[i]>0?'+':''}${adj[i]}%</b></div>`).join('')}</div>
<div class="card"><h3>Projected outcome</h3><div class="tw"><table><tr><th></th><th>Now</th><th>Projected</th><th>Change</th></tr>${[['Spend',base.sp,t.sp],['True profit',base.pr,t.pr],['Incremental customers',base.cu,t.cu]].map(([n,a,b],k)=>`<tr><td>${n}</td><td>${k<2?fL(a):fN(a)}</td><td><b>${k<2?fL(b):fN(b)}</b></td><td><span class="pill ${b>=a||n=='Spend'&&b<a?'p-g':'p-r'}">${n=='True profit'?(b-a>=0?'+':'')+fL(b-a):pc(b/a-1,1)}</span></td></tr>`).join('')}<tr><td>Profit per ₹1 spent</td><td>${(base.pr/base.sp).toFixed(2)}</td><td><b>${(t.pr/t.sp).toFixed(2)}</b></td><td></td></tr></table></div><h3 style="margin-top:12px">Budget moves</h3>${hbar(D.map((c,i)=>({n:c.n,v:x[i]-c.sp,c:x[i]>=c.sp?'#1aa37a':'#e0453a'})).sort((a,b)=>b.v-a.v))}${nt('Right of the line: campaigns that get more money. Left: money taken away.',t.pr>base.pr?`This scenario adds <b>${fL(t.pr-base.pr)}</b> of annual profit.`:'Use Apply AI plan for the optimal allocation.')}</div></div>`},
Agent(){return`<div class="card"><h3>AI budget analyst</h3><p class="nt">Ask about waste, a specific campaign, or a budget scenario. The agent lists the tools it runs, then answers from the data.</p><div id="chat"></div><div class="row" style="margin-top:10px">${['Where are we wasting budget?','Why is retargeting a bad investment?','Which campaigns should get more money?','Run the optimal reallocation','What if we cut the budget by 10%?','Is Brand Search worth it?'].map(q=>`<button class="chip" data-q="${q}">${q}</button>`).join('')}</div><form class="ask" onsubmit="return false"><input id="q" placeholder="e.g. Should we scale Webinars?" autocomplete="off"><button class="btn p" id="go">Ask</button></form></div>`}};
function draw(){document.getElementById('nav').innerHTML=['Overview','Campaigns','Effect','Curves','Optimizer','Agent'].map(t=>`<button class="${t==tab?'on':''}" data-t="${t}">${{Effect:'Effectiveness',Curves:'Response curves',Agent:'AI agent'}[t]||t}</button>`).join('');document.getElementById('app').innerHTML=VW[tab]();if(tab=='Agent'){hist.forEach(h=>add(h[0],h[1],1));if(!hist.length)add('a','Hi, I’m your budget analyst. I compare reported performance with true incremental profit and recommend where to move money. Try a question below.')}}
function add(c,h,q){const d=document.createElement('div');d.className='m '+c;d.innerHTML=h;const ch=document.getElementById('chat');ch.appendChild(d);ch.scrollTop=1e9;if(!q)hist.push([c,h])}
function think(steps,out){const b=document.createElement('div');b.className='m a';const ch=document.getElementById('chat');ch.appendChild(b);let i=0;(function n(){if(i<steps.length){b.innerHTML+=`<div class="st">${steps[i++]}</div>`;ch.scrollTop=1e9;setTimeout(n,400)}else{b.remove();add('a',steps.map(s=>`<div class="st">${s}</div>`).join('')+'<hr style="border:0;border-top:1px solid var(--line)">'+out)}})()}
const li=a=>a.map(x=>'• '+x).join('<br>');
function ask(t){add('u',t);const l=t.toLowerCase();let k=KW.find(([r])=>r.test(l));
if(/cut|reduce|increase|add|raise|grow/.test(l)&&/budget|total/.test(l)){const p=+((l.match(/(\d+)\s*%/)||[0,10])[1]),f=/cut|reduce/.test(l)?-p:p,x=opt(.4,f/100),n=tot(x);return think(['scenario(total_budget '+(f>0?'+':'')+f+'%)','optimize(response_curves, cap ±40%)','project(profit, customers)'],`With total budget <b>${f>0?'+':''}${f}%</b> (${fL(n.sp)}) the best allocation yields true profit <b>${fL(n.pr)}</b> vs ${fL(base.pr)} today (${n.pr>=base.pr?'+':''}${fL(n.pr-base.pr)}). ${f<0&&n.pr>=base.pr?'Cutting waste costs nothing: profit actually rises.':''}`)}
if(/optimal|reallocat|plan/.test(l)){const x=opt(cap/100,bch/100),n=tot(x);adj=x.map((v,i)=>Math.round((v/D[i].sp-1)*100));const mv=D.map((c,i)=>({c,d:x[i]-c.sp})).sort((a,b)=>b.d-a.d);return think(['incrementality_adjust(customers)','fit_response_curves(β per campaign)','greedy_allocate(marginal profit per ₹)','project(profit)'],`True profit ${fL(base.pr)} → <b>${fL(n.pr)}</b> (+${fL(n.pr-base.pr)}), spend ${fL(base.sp)} → ${fL(n.sp)}.<br>Add: ${mv.slice(0,4).map(m=>`<b>${m.c.n}</b> +${fL(m.d)}`).join(', ')}.<br>Cut: ${mv.slice(-4).reverse().map(m=>`<b>${m.c.n}</b> ${fL(m.d)}`).join(', ')}. <button class="chip" data-t="Optimizer">Open optimizer</button>`)}
if(k&&!/waste|wasting/.test(l)){const c=D[k[1]],o=opt(.4,0)[c.i],m=mg(c,c.sp);return think(['campaign_lookup('+c.n+')','incrementality_check','marginal_return(curve)','compare(AI plan)'],`<b>${c.n}</b> is a <b>${verd(c)[0]}</b> campaign. Platform ROAS ${c.rroas.toFixed(1)}×, but only ${pc(c.inc)} of customers are incremental, so true CAC is ${fL(c.tcac)} (reported ${fL(c.cac)}) and true profit ${fL(c.tprof)}. An extra ₹1 returns ₹${(1+m).toFixed(2)}. AI plan: ${fL(c.sp)} → <b>${fL(o)}</b>.`)}
if(/more money|scale|invest|best|top|profitable/.test(l)){const w=D.filter(c=>verd(c)[0]=='Scale').sort((a,b)=>mg(b,b.sp)-mg(a,a.sp));return think(['marginal_return(all)','filter(marginal > 0.5)','rank'],`Scale these (highest return on the next rupee):<br>${li(w.map(c=>`<b>${c.n}</b>: ₹1 → ₹${(1+mg(c,c.sp)).toFixed(2)}, ${pc(c.inc)} incremental, true profit ${fL(c.tprof)}`))}`)}
if(/waste|wasting|inefficient|loss|losing|worst/.test(l)){const w=D.filter(c=>c.tprof<0).sort((a,b)=>a.tprof-b.tprof);return think(['profit_true(all campaigns)','filter(profit < 0)','rank(by loss)'],`<b>${w.length}</b> campaigns lose money, using ${pc(NEG/TS)} of budget (${fL(NEG)}) and losing <b>${fL(LOSS)}</b>. Worst:<br>${li(w.slice(0,5).map(c=>`<b>${c.n}</b>: spend ${fL(c.sp)}, loss ${fL(-c.tprof)}, ${pc(c.inc)} incremental`))}`)}
add('a','I can explain waste, rank campaigns to scale, analyse one campaign (e.g. “Is Brand Search worth it?”), run the optimal reallocation, or test a budget change like “cut the budget by 10%”.')}
document.addEventListener('click',e=>{const t=e.target.closest('button,th[data-s]');if(!t)return;const d=t.dataset;if(d.t){tab=d.t;draw()}else if(d.s){if(sk==d.s)sd=-sd;else{sk=d.s;sd=d.s=='n'?1:-1}draw()}else if(d.q)ask(d.q);else if(t.id=='go'){const q=document.getElementById('q');if(q.value.trim()){ask(q.value);q.value=''}}else if(t.id=='ap'){adj=opt(cap/100,bch/100).map((v,i)=>Math.round((v/D[i].sp-1)*100));draw()}else if(t.id=='rs'){adj.fill(0);draw()}});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.a!=null||d.g){if(d.a!=null)adj[+d.a]=+e.target.value;else{(d.g=='cap'?cap=+e.target.value:bch=+e.target.value)}const y=scrollY;draw();scrollTo(0,y)}});
document.addEventListener('change',e=>{if(e.target.id=='cf'){chf=e.target.value;draw()}if(e.target.id=='cs'){sel=+e.target.value;draw()}});
document.addEventListener('submit',e=>e.preventDefault());draw();
</script></body></html>
